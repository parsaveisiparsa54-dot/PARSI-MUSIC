name: Build PARSI MUSIC APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check ZIP file
    run: |
      ls -la
      test -f ParsiMusic.zip

  - name: Extract project
    run: |
      unzip -q ParsiMusic.zip -d extracted
      echo "Project files:"
      find extracted -maxdepth 3 -type f | head -80

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    run: |
      PROJECT_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Android project settings.gradle was not found."
        exit 1
      fi
      echo "Building project from: $PROJECT_DIR"
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: PARSI-MUSIC-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
